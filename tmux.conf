# tmux config for workshop's server (socket -L <profile>).
# One tmux session per Claude Code session; exactly one client (workshop's pty) attaches to each.
# Keep this minimal: the pane IS the terminal, tmux is only here so sessions survive the app quitting.

set -g status off
set -g mouse on
# A drag selects and copies to the Mac's clipboard on release. tmux's own binding keeps it in a tmux
# buffer and offers it out as OSC 52, which xterm.js drops. Claude Code's fullscreen renderer takes
# the mouse and copies by itself; this is for every pane that does not (the classic renderer, a
# dead pane's error, Codex).
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g allow-passthrough on
# Pass OSC 8 hyperlinks on to the client (node-pty, TERM xterm-256color): without the feature tmux
# keeps them to itself, and Claude Code writes every markdown link as one (inside tmux 3.4+).
set -as terminal-features ",xterm-256color:hyperlinks"

# Forward the pane's title (Claude sets it) to the outer terminal, so xterm.js sees it.
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# When claude exits cleanly the session goes away and the slot frees.
# When it exits with an error the dead pane stays so the error is readable.
set -g remain-on-exit failed
set -g destroy-unattached off
set -g detach-on-destroy on

# The one attached client decides the size; there is never a second client.
set -g window-size latest
setw -g aggressive-resize on
