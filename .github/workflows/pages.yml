# The project page (site/, built by vite.site.config.ts into out/site) on GitHub Pages.
# Pages must be set to "GitHub Actions" in the repository's settings for the deploy to land.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # The page imports core's own code: the Knot, the index's rules, permissions in words, and the
      # built-in tiles' manifests and icons for the marketplace.
      - 'src/shared/**'
      - 'tiles/*/tile.json'
      - 'tiles/*/icon.svg'
      - 'src/renderer/src/cosmos.ts'
      - 'src/shared/themes.ts'
      - 'docs/assets/**'
      - 'assets/fonts/**'
      - 'vite.site.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Only what the page needs: no Electron download, no native rebuild (postinstall).
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
